name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version

    - name: Build App for Simulator
      run: |
        xcodebuild clean build \
          -project ThreeOneOSFive.xcodeproj \
          -alltargets \
          -sdk iphonesimulator \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into .ipa
      run: |
        mkdir -p Payload
        # Tìm tự động tệp .app được sinh ra sau khi build và copy vào Payload
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find . -name "*.app" | head -n 1)
        fi
        
        echo "Found app at: $APP_PATH"
        cp -r "$APP_PATH" Payload/
        
        zip -r ThreeOneOSFive.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThreeOneOSFive-IPA
        path: ThreeOneOSFive.ipa
