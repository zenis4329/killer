name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version

    - name: List Schemes (Kiểm tra tên scheme chính xác)
      run: |
        xcodebuild -list -project ThreeOneOSFive.xcodeproj

    - name: Build for Simulator
      run: |
        # Lấy scheme đầu tiên tìm thấy trong project để build tránh lỗi sai tên
        SCHEME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj -json | tr -d '\n' | grep -o '"schemes":\[[^]]*\]' | grep -o '"[^"]*"' | head -n 2 | tail -n 1 | tr -d '"')
        echo "Using scheme: $SCHEME"

        xcodebuild clean build \
          -project ThreeOneOSFive.xcodeproj \
          -scheme "$SCHEME" \
          -sdk iphonesimulator \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
